symfonycasts_reset_password:
    request_password_repository: App\Repository\PasswortResetAnfrageRepository

    # Gültigkeit des Links in Sekunden (1 Stunde).
    lifetime: 3600

    # Frühestens nach 10 Minuten darf erneut ein Link angefordert werden.
    # (Bewusst kürzer als der Bundle-Default von 1 Stunde: landet die erste Mail
    # im Spam, soll der Nutzer nicht eine Stunde ausgesperrt sein.)
    throttle_limit: 600
